name: X4 Arsenal CI

on:
  push:
    branches: [main, x4-beast-arsenal-mvp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  x4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Install test tooling
        run: python -m pip install --upgrade pytest ruff
      - name: Compile X4
        run: python -m compileall -q x4 tests/x4
      - name: Lint X4
        run: ruff check x4 tests/x4
      - name: Test X4
        env:
          PYTHONPATH: .
        run: pytest -q tests/x4
